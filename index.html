<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Objets TSA dynamiques</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    #controls { position: absolute; top: 20px; left: 20px; z-index: 100; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #label { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
             font-size: 20px; font-weight: bold; color: #ff4081; text-shadow: 1px 1px 3px #000; }
  </style>
</head>
<body>

<div id="controls">
  <button id="nextObject">Afficher le prochain objet</button>
</div>
<div id="label"></div>

<a-scene>
  <a-entity id="currentObject"></a-entity>

    <a-entity
      id="Cylindre"
      position="0 0 0"
      rotation="90 0 0"
      scale="1 1 1"
      obj-model="obj: assets/cylindre.obj">
  </a-entity>

  <!-- Pivot pour la caméra orbitale -->
  <a-entity id="cameraPivot" rotation="0 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
    <a-entity id="playerCamera" camera position="0 2 5" look-controls="enabled: true"></a-entity>
  </a-entity>


</a-scene>

<script>
const objects = [
  {id:"Aéroport", model:"assets/aeroport.glb", position:"0 0 0", scale:"0.1 0.1 0.1", rotation:"0 0 0"},
  {id:"Avion", model:"assets/avion.glb", position:"0 1.27788 0", scale:"0.15 0.15 0.15", rotation:"0 0 0"},
  {id:"Clé", model:"assets/cle.glb", position:"0 0.24814 0", scale:"60 60 60", rotation:"0 0 0"},
  {id:"Clé2", model:"assets/cle2.glb", position:"0 0.14946 0", scale:"0.1 0.1 0.1", rotation:"15.449 1.137 -25.862"},
 {id: "Clé3", model: "assets/cle3.glb", position: "0 0.14946 0", scale: "7 7 7", rotation: "88.85830557345398 0 0"},
  {id: "Douanier1", model: "assets/douanier1.glb", position: "0 1.8271 -0.16207", scale: "3 3 2", rotation: "90 0 0"},
  {id:"Douanier2", model:"assets/douanier2.glb", position:"0 0 0", scale:"0.5 0.5 0.5", rotation:"0 0 0"},
  {id:"Lockpick", model:"assets/lockpick.glb", position:"0 0.11829 0", scale:"2 2 2", rotation:"-89.778 180 180"},
 {id: "Logo TSA", model: "assets/logo_tsa.glb", position: "0 0 0", scale: "200 10 200", rotation: "0 0 0"},
  {id: "Douanier1", model: "assets/douanier1.glb", position: "0 1.8271 -0.16207", scale: "3 3 2", rotation: "90 0 0"},
  {id:"Voiture2", model:"assets/voiture2.glb", position:"0 0 0", scale:"0.5 0.5 0.5", rotation:"0 0 0"},
  {id: "Voiture2", model: "assets/voiture2.glb", position: "0 1.52769 0", scale: "0.5 0.5 0.5", rotation: "0 0 0"},
  {id:"Voleur", model:"assets/voleur.glb", position:"0 0 0", scale:"0.5 0.5 0.5", rotation:"0 0 0"}
];

let index = 0;
const button = document.getElementById('nextObject');
const container = document.getElementById('currentObject');
const label = document.getElementById('label');

button.addEventListener('click', () => {
  if(index >= objects.length) index = 0;

  while(container.firstChild) container.removeChild(container.firstChild);

  const data = objects[index];
  const entity = document.createElement('a-entity');
  entity.setAttribute('id', data.id);
  entity.setAttribute('position', data.position);
  entity.setAttribute('scale', data.scale);
  entity.setAttribute('rotation', data.rotation);

  if(data.model.endsWith(".obj")){
    entity.setAttribute('obj-model', `obj: url(${data.model})`);
  } else {
    entity.setAttribute('gltf-model', data.model);
  }

  entity.setAttribute('animation__scale', `dur: 600; easing: easeOutElastic; property: scale; to: ${data.scale}`);
  entity.setAttribute('animation__bounce', `dur: 600; easing: easeOutElastic; from: 0 2 0; property: position; to: ${data.position}`);

  container.appendChild(entity);
  label.textContent = data.id;
  index++;
});
</script>

</body>
</html>
