<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <style>
      #spawnBtn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 25px;
        font-size: 18px;
        background: #4a7;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <button id="spawnBtn">Objet suivant</button>

    <a-scene>
      <!-- Caméra qui tourne autour de l'objet -->
      <a-entity id="camRig" position="0 1.6 3">
        <a-camera></a-camera>
      </a-entity>

      <a-entity id="objectContainer"></a-entity>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
      const objects = [
        {
          id: "Clé",
          model: "assets/cle.glb",
          position: "0 0.24814 0",
          scale: "0.02 0.02 0.02",
          rotation: {x: 0, y: 0, z: 0}
        },
        {
          id: "Lockpick",
          model: "assets/lockpick.glb",
          position: "0 0.11829 0",
          scale: "0.02 0.02 0.02",
          rotation: {x: -90, y: 180, z: 180}
        },
        {
          id: "Clé2",
          model: "assets/cle2.glb",
          position: "0 0.14946 0",
          scale: "0.1 0.1 0.1",
          rotation: {x: 15.45, y: 1.13, z: -25.86}
        }
      ];

      let index = 0;

      function spawnNext() {
        const container = document.getElementById("objectContainer");
        
        container.innerHTML = ""; // supprime l’objet précédent
        
        const obj = objects[index];

        const entity = document.createElement("a-entity");
        entity.setAttribute("id", obj.id);
        entity.setAttribute("position", obj.position);
        entity.setAttribute("scale", obj.scale);
        entity.setAttribute("rotation", `${obj.rotation.x} ${obj.rotation.y} ${obj.rotation.z}`);
        entity.setAttribute("gltf-model", obj.model);

        // Animation cartoon
        entity.setAttribute("animation__scale", 
          "dur: 600; easing: easeOutElastic; property: scale; to: " + obj.scale
        );

        entity.setAttribute("animation__bounce", 
          "dur: 600; easing: easeOutElastic; from: 0 2 0; property: position; to: " + obj.position
        );

        container.appendChild(entity);

        index = (index + 1) % objects.length;
      }

      document.getElementById("spawnBtn").onclick = spawnNext;

      // Rotation automatique de la caméra
      let angle = 0;
      function rotateCamera() {
        angle += 0.3;
        const rad = angle * Math.PI / 180;
        const cam = document.getElementById("camRig");
        const x = Math.sin(rad) * 3;
        const z = Math.cos(rad) * 3;
        cam.setAttribute("position", `${x} 1.6 ${z}`);
        cam.setAttribute("rotation", `0 ${-angle} 0`);
        requestAnimationFrame(rotateCamera);
      }
      rotateCamera();
    </script>
  </body>
</html>
