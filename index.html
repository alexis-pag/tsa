<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Objets TSA dynamiques</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    #controls { position: absolute; top: 20px; left: 20px; z-index: 100; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #label { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
             font-size: 20px; font-weight: bold; color: #ff4081; text-shadow: 1px 1px 3px #000; }
  </style>
</head>
<body>

<div id="controls">
  <button id="nextObject">Afficher le prochain objet</button>
</div>
<div id="label"></div>

<a-scene>
  <a-entity id="currentObject"></a-entity>

  <a-entity id="cameraPivot" rotation="0 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
    <a-entity id="playerCamera" camera position="0 2 5" look-controls="enabled: true"></a-entity>
  </a-entity>

  <!-- Cylindre de 1 m² -->
  <a-entity 
    obj-model="obj: assets/cylindre.obj" 
    scale="1.128 0.3 1.128"
    rotation="90 0 0" 
    material="color: #383838">
  </a-entity>
</a-scene>

<script>
const objects = [
  {id:"Aéroport", model:"assets/aeroport.glb", position:"0 0.7 0", scale:"0.1 0.1 0.1", rotation:"0 0 0"},
  {id:"Avion", model:"assets/avion.glb", position:"0 0.7 0", scale:"0.15 0.15 0.15", rotation:"0 0 0"},
  {id:"Clé", model:"assets/cle.glb", position:"0 0.7 0", scale:"60 60 60", rotation:"0 0 0"},
  {id:"Clé2", model:"assets/cle2.glb", position:"0 0.7 0", scale:"0.1 0.1 0.1", rotation:"15.449 1.137 -25.862"},
  {id:"Clé3", model:"assets/cle3.glb", position:"0 0.7 0", scale:"7 7 7", rotation:"88.85830557345398 0 0"},
  {id:"Douanier1", model:"assets/douanier1.glb", position:"0 0.7 -0.16207", scale:"3 3 2", rotation:"90 0 0"},
  {id:"Douanier2", model:"assets/douanier2.glb", position:"0 0.7 0", scale:"0.5 0.5 0.5", rotation:"0 0 0"},
  {id:"Lockpick", model:"assets/lockpick.glb", position:"0 0.7 0", scale:"2 2 2", rotation:"-89.778 180 180"},
  {id:"Logo TSA", model:"assets/logo_tsa.glb", position:"0 0.7 0", scale:"200 10 200", rotation:"0 0 0"},
  {id:"Voiture1", model:"assets/voiture1.glb", position:"0 0.7 0", scale:"1 1 1", rotation:"0 0 0"},
  {id:"Voiture2", model:"assets/voiture2.glb", position:"0 0.7 0", scale:"0.5 0.5 0.5", rotation:"0 0 0"},
  {id:"Voiture3", model:"assets/voiture3.glb", position:"0 0.7 0", scale:"0.01 0.01 0.01", rotation:"0 0 0"},
  {id:"Voleur", model:"assets/voleur.glb", position:"0 0.7 0", scale:"1 1 1", rotation:"0 0 0"}
];

let index = 0;
const container = document.getElementById('currentObject');
const label = document.getElementById('label');

function showObject(idx) {
  if(idx < 0) idx = objects.length - 1;
  if(idx >= objects.length) idx = 0;
  index = idx;

  while(container.firstChild) container.removeChild(container.firstChild);

  const data = objects[index];
  const entity = document.createElement('a-entity');
  entity.setAttribute('id', data.id);

  const startY = 10;
  entity.setAttribute('position', `0 ${startY} 0`);
  entity.setAttribute('scale', data.scale);
  entity.setAttribute('rotation', data.rotation);

  if(data.model.endsWith(".obj")) {
    entity.setAttribute('obj-model', `obj: url(${data.model})`);
  } else {
    entity.setAttribute('gltf-model', data.model);
  }

  container.appendChild(entity);
  label.textContent = data.id;

  const finalY = parseFloat(data.position.split(" ")[1]);
  const scaleVals = data.scale.split(' ').map(parseFloat);

  // Chute lente
  entity.setAttribute('animation__fall', {
    property: 'position',
    to: `0 ${finalY} 0`,
    dur: 1500,
    easing: 'easeInQuad',
    startEvents: 'dropStart'
  });

  // Squash/stretch cartoon
  entity.setAttribute('animation__stretch', {
    property: 'scale',
    from: data.scale,
    to: `${scaleVals[0]*1.2} ${scaleVals[1]*0.7} ${scaleVals[2]*1.2}`,
    dur: 1500,
    easing: 'easeInOutQuad',
    startEvents: 'dropStart'
  });

  entity.emit('dropStart');

  // Rebond cartoon
  setTimeout(() => {
    let bounceHeight = 2;
    let duration = 500;
    let dampening = 0.5;
    let delay = 0;

    function bounce() {
      if(bounceHeight < 0.05) {
        entity.setAttribute('position', data.position);
        entity.setAttribute('scale', data.scale);
        return;
      }

      entity.setAttribute(`animation__bounce${delay}`, {
        property: 'position',
        from: `0 ${finalY + bounceHeight} 0`,
        to: `0 ${finalY} 0`,
        dur: duration,
        easing: 'easeOutQuad',
        startEvents: `startBounce${delay}`
      });

      entity.setAttribute(`animation__squash${delay}`, {
        property: 'scale',
        from: `${scaleVals[0]*1.2} ${scaleVals[1]*0.7} ${scaleVals[2]*1.2}`,
        to: data.scale,
        dur: duration,
        easing: 'easeOutQuad',
        startEvents: `startBounce${delay}`
      });

      setTimeout(() => {
        bounceHeight *= dampening;
        duration *= 0.7;
        delay += 1;
        entity.emit(`startBounce${delay}`);
        bounce();
      }, duration);
    }

    bounce();
  }, 1500);
}

document.getElementById('nextObject').addEventListener('click', () => {
  showObject(index + 1);
});

document.addEventListener('keydown', (e) => {
  if(e.key === "ArrowRight") showObject(index + 1);
  else if(e.key === "ArrowLeft") showObject(index - 1);
});

showObject(index);
</script>

</body>
</html>
